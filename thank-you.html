<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <!-- Meta Pixel Code -->
    <script>

    <style>
        /* ---------- BRAND COLORS ---------- */
        :root {
            --primary: #003B64;
            --accent: #FD5C63;
            --bg-soft: #FFFCE5;
        }

        /* ---------- RESET ---------- */
        * {
            box-sizing: border-box;
            font-family: "Poppins", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ---------- CARD ---------- */
        .thankyou-card {
            background: #ffffff;
            max-width: 520px;
            width: 100%;
            padding: 48px 40px;
            border-radius: 28px;
            text-align: center;
            box-shadow:
                0 18px 45px rgba(0, 59, 100, 0.18),
                0 35px 90px rgba(0, 59, 100, 0.28);
        }

        /* ---------- ICON ---------- */
        .check-icon {
            width: 90px;
            height: 90px;
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            margin: 0 auto 24px;
            box-shadow: 0 12px 30px rgba(253, 92, 99, 0.45);
        }

        /* ---------- TEXT ---------- */
        .thankyou-title {
            color: var(--primary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .thankyou-text {
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* ---------- BUTTON ---------- */
        .home-btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: #002f4f;
            box-shadow: 0 12px 35px rgba(0, 59, 100, 0.4);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .thankyou-card {
                padding: 36px 26px;
            }

            .thankyou-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="thankyou-card">
        <div class="check-icon">✓</div>

        <h1 class="thankyou-title">Thank You!</h1>

        <p class="thankyou-text">
            We’ve received your details successfully.
            Our team will get in touch with you shortly to discuss your requirements.
        </p>

        <a href="/" class="home-btn">Back to Home</a>
    </div>


    <!-- META PIXEL THANK YOU EVENT -->
    <script>
        fbq('track', 'thankyoupageopened');
    </script>
</body>

</html>
